[model]
id = "models--sh0ck0r--L3-Aethora-15B-FP8-Dynamic"

[gen]
stream = true
max_new_tokens = 8192
temperature = 1.2
top_p = 0.99
top_k = 320
min_p = 0.03
repetition_penalty = 1.0
presence_penalty = 1.1
frequency_penalty = 0.0
stop_strings = []
stop_token_ids = []
ignore_eos = false
min_tokens = 0
best_of = 1
use_beam_search = false
length_penalty = 1.0
include_stop_str_in_output = false
skip_special_tokens = true
spaces_between_special_tokens = true
truncate_prompt_tokens = 0
allowed_token_ids = []
prompt_logprobs = 0

[prompt]
chat_template = ""
system = ""
system_file = "models/models--sh0ck0r--L3-Aethora-15B-FP8-Dynamic/vllm/prompts/system.txt"
user_prefix = ""

[ui]
show_thinking = true
assume_think = false
history_strip_think = false
no_animate_thinking = false
save_transcript = ""
capture_last_request = true
scroll_lines = 9
show_tool_activity = false
show_tool_arguments = false
ui_tick_ms = 33
ui_max_events_per_tick = 120

[telemetry]
jsonl = ""
sample_interval_s = 1.0

[tools]
enabled = false
mode = "dry_run"
schema_file = ""
tool_choice = ""
allow = []
deny = []
max_calls_per_turn = 3
timeout_s = 10
max_result_chars = 8002

[backend.vllm]
mode = "managed"
host = "127.0.0.1"
port = 40223
cmd = "env PYTORCH_ALLOC_CONF=expandable_segments:True VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 vllm"
extra_args = ["--kv-cache-dtype", "fp8", "--enforce-eager"]
base_url = ""
api_key = ""
timeout_s = 900
generation_config = "vllm"
attention_backend = ""
dtype = ""
enable_auto_tool_choice = false
tool_call_parser = ""
log_file = ""
served_model_name = "Aethora"
tensor_parallel_size = 1
gpu_memory_utilization = 0.95
max_model_len = 52784

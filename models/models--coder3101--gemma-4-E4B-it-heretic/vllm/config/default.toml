[model]
id = "models--coder3101--gemma-4-E4B-it-heretic"

[gen]
stream = true
max_new_tokens = 16348
temperature = 1.2
# top_p = 1.0
top_k = 64
min_p = 0.05
# repetition_penalty = 0.0
presence_penalty = 0.75
# frequency_penalty = 0.0
stop_strings = []
stop_token_ids = []
ignore_eos = false
min_tokens = 0
best_of = 1
use_beam_search = false
# length_penalty = 1.0
include_stop_str_in_output = false
# skip_special_tokens = true
spaces_between_special_tokens = true
truncate_prompt_tokens = 0
allowed_token_ids = []
prompt_logprobs = 0

[prompt]
chat_template = ""
system = ""
system_file = "models/models--sh0ck0r--L3-Aethora-15B-FP8-Dynamic/vllm/prompts/system.txt"
user_prefix = ""

[ui]
show_thinking = false
assume_think = false
history_strip_think = true
no_animate_thinking = false
save_transcript = ""
capture_last_request = true
scroll_lines = 9
show_tool_activity = false
show_tool_arguments = false
ui_tick_ms = 33
ui_max_events_per_tick = 120

[telemetry]
jsonl = ""
sample_interval_s = 1.0

[tools]
enabled = false
mode = "execute"
tool_choice = "auto"
schema_file = ""
allow = []
deny = []
max_calls_per_turn = 3
timeout_s = 10
max_result_chars = 8000

[backend.vllm]
mode = "managed"
host = "127.0.0.1"
port = 40223
cmd = "vllm"
extra_args = ["--max-num-seqs", "1", "--enable-log-requests", "--stream-interval", "1"]
base_url = ""
api_key = ""
timeout_s = 900
generation_config = "auto"
attention_backend = ""
dtype = "bfloat16"
kv_cache_dtype = "fp8-e4m3"
performance_mode = "interactivity"
enable_auto_tool_choice = true
tool_call_parser = "gemma4"
reasoning_parser = "gemma4"
log_file = ""
served_model_name = ""
tensor_parallel_size = 1
gpu_memory_utilization = 0.95
max_model_len = 131072